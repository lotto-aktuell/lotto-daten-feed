name: Lotto-Daten aktualisieren

on:
  schedule:
    # nach den Ziehungen Mi (18:25) & Sa (19:25) deutscher Zeit,
    # plus Sicherheitslauf am Folgetag (falls das Archiv verzögert aktualisiert)
    - cron: '45 21 * * 3,6'
    - cron: '15 6 * * 0,4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Daten abrufen & konvertieren
        run: node convert.js
      - name: Änderungen committen
        run: |
          git config user.name "lotto-daten-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/lotto6aus49.json
          git diff --cached --quiet && echo "keine neuen Ziehungen" || git commit -m "Daten-Update $(date -u +%F)"
          git push
