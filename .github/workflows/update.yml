name: Lotto-Daten aktualisieren

on:
  schedule:
    # Abends nach den Ziehungen: Di+Fr (EuroJackpot), Mi+Sa (6aus49)
    - cron: '45 21 * * 2,3,5,6'
    # Nachzügler-Lauf am Folgemorgen, falls die Quelle abends noch alt war
    - cron: '15 6 * * 0,3,4,6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Lotto 6aus49 abrufen & konvertieren
        run: node convert.js
      - name: EuroJackpot abrufen & konvertieren
        run: node convert-ej.js
      - name: Änderungen committen
        run: |
          git config user.name "lotto-daten-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/lotto6aus49.json docs/eurojackpot.json
          git diff --cached --quiet && echo "keine neuen Ziehungen" || git commit -m "Daten-Update $(date -u +%F)"
          git push
